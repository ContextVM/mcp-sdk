name: Publish ContextVM SDK
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    publish:
        if: github.repository == 'ContextVM/mcp-sdk' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: release
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - run: pnpm build:all
            - run: pnpm check:all
            - run: pnpm --filter @contextvm/mcp-sdk publish --access public --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
