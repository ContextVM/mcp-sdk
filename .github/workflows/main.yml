name: Verify lightweight SDK
on: [push, pull_request]
permissions:
    contents: read
jobs:
    verify:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [20, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build:all
            - run: pnpm check:all

    acceptance:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: pnpm install --frozen-lockfile
            - run: pnpm build:all
            - run: pnpm test:conformance
            - run: pnpm test:acceptance
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: mcp-compatibility-evidence
                  path: results/
